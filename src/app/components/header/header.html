<div>
    <h1>Marketplace de Alojamientos</h1>
    <app-button textButton="Inicio"></app-button>
    <app-button textButton="Publicar alojamiento"></app-button>
    <app-search-bar></app-search-bar>
    <app-button textButton="Iniciar sesión"></app-button>
    <app-button textButton="Registrarse"></app-button>
    <dialog id="loginDialog">
        <form>
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Iniciar sesión</button>
        </form>
        <button id="closeDialog">Cerrar</button>
    </dialog>
    <dialog id="registerDialog">
        <form>
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Registrarse</button>
        </form>
        <button id="closeDialog">Cerrar</button>
    </dialog>
</div>
