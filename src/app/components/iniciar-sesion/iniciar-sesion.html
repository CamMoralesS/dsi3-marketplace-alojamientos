<section class="pagina">
  <h1>Iniciar sesión</h1>
  <p>No hay backend de autenticación; el acceso es solo simulado.</p>

  <div class="formulario">
    <app-custom-input
      inputLabel="Correo"
      inputType="email"
      [(value)]="correo"
    ></app-custom-input>
    <app-custom-input
      inputLabel="Contraseña"
      inputType="password"
      [(value)]="contrasena"
    ></app-custom-input>
    <app-button textButton="Entrar" (buttonClick)="entrar()"></app-button>
  </div>
</section>
